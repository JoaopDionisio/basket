<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f4ece0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1f1b17" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Basket" />
  <title>Basket</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Inventory (left) -->
    <aside class="pantry" id="pantry" aria-label="Inventory">
      <div class="pantry-head">
        <span class="pantry-title">Pantry</span>
        <button class="icon-btn" id="editToggle" aria-pressed="false" aria-label="Edit pantry">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
        </button>
      </div>
      <div class="pantry-scroll" id="categories"></div>
      <p class="pantry-hint">Tap or drag to add</p>
    </aside>

    <!-- List (right) -->
    <main class="board" id="board" aria-label="Shopping list">
      <header class="board-head">
        <button class="list-title" id="listTitle" aria-label="Rename list">
          <span id="listName">My list</span>
          <span class="dirty-dot" id="dirtyDot" title="Unsaved changes"></span>
        </button>
        <p class="list-meta" id="listMeta">0 items</p>
      </header>

      <ul class="items" id="items"></ul>

      <div class="empty" id="empty">
        <svg viewBox="0 0 120 100" aria-hidden="true">
          <path class="basket-handle" d="M30 44c4-22 56-22 60 0" />
          <path class="basket-body" d="M16 44h88l-9 40a8 8 0 0 1-8 6H33a8 8 0 0 1-8-6Z" />
          <path class="basket-weave" d="M40 56v22M60 56v22M80 56v22" />
        </svg>
        <p>Your basket is empty.<br /><span>Drag something in from the pantry.</span></p>
      </div>

      <div class="drop-glow" aria-hidden="true"></div>

      <nav class="actions" aria-label="List actions">
        <button class="act" id="btnClear">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span>Clear</span>
        </button>
        <button class="act act-primary" id="btnSave">
          <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5Z"/><path d="M8 4v5h7V4"/><path d="M8 20v-6h8v6"/></svg>
          <span>Save</span>
        </button>
        <button class="act" id="btnLoad">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          <span>Load</span>
        </button>
        <button class="act act-danger" id="btnDelete">
          <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
          <span>Delete</span>
        </button>
      </nav>
    </main>
  </div>

  <!-- Bottom sheet (load / name / confirm) -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <div id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
